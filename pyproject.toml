[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cursorforge"
version = "0.1.0"
description = "Package Windows mouse cursors (.cur/.ani) from PNGs - multi-tier, animated, hotspot-aware"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["Pillow>=10.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = ["cursorforge"]
